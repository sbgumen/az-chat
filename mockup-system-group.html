<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创建群聊 - AZ-Chat</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Noto Sans SC', sans-serif; background: #e8e3da; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  #root { width: 390px; height: 844px; overflow: hidden; border-radius: 32px; box-shadow: 0 25px 80px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.06); position: relative; background: #faf8f5; }

  .scrollbar-hide::-webkit-scrollbar { display: none; }
  .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

  .shimmer {
    background: linear-gradient(90deg, #f0ece5 0%, #faf8f5 45%, #f0ece5 80%);
    background-size: 300% 100%;
    animation: shimmer 2s ease-in-out infinite;
  }
  @keyframes shimmer {
    0% { background-position: -300% 0; }
    100% { background-position: 300% 0; }
  }

  .slide-up-enter { animation: slideUp 0.35s ease-out both; }
  @keyframes slideUp {
    from { opacity: 0; max-height: 0; margin-top: 0; }
    to { opacity: 1; max-height: 200px; margin-top: 12px; }
  }
  .slide-up-exit { animation: slideDown 0.25s ease-in both; }
  @keyframes slideDown {
    from { opacity: 1; max-height: 200px; margin-top: 12px; }
    to { opacity: 0; max-height: 0; margin-top: 0; }
  }

  .check-pop { animation: checkPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  @keyframes checkPop {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .tab-slide { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

  .card-pulse { animation: cardPulse 0.4s ease-out; }
  @keyframes cardPulse {
    0% { transform: scale(0.96); }
    50% { transform: scale(1.02); }
    100% { transform: scale(1); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
// ====== INLINE ICONS (lucide-alike SVG) ======
const I = {
  ArrowLeft: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b5e4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>',
  Shield: (c='#7c3aed') => `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,
  ShieldSmall: (c='#7c3aed') => `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,
  Users: (c='currentColor') => `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
  Globe: (c='currentColor') => `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`,
  UsersGroup: (c='currentColor') => `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
  Check: (c='white', s=11, sw=3) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
  Shield17: (c='white') => `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,
};

// ====== DATA ======
const FRIENDS = [
  { id: 1, name: '林小夏' },
  { id: 2, name: '陈子涵' },
  { id: 3, name: '王雨晴' },
  { id: 4, name: '张明远' },
  { id: 5, name: '赵思雨' },
  { id: 6, name: '刘一诺' },
  { id: 7, name: '周若曦' },
  { id: 8, name: '吴昊天' },
  { id: 9, name: '黄诗涵' },
  { id: 10, name: '许晨阳' },
];

const AVATAR_COLORS = [
  'bg-rose-300', 'bg-sky-300', 'bg-amber-300', 'bg-emerald-300',
  'bg-violet-300', 'bg-cyan-300', 'bg-pink-300', 'bg-lime-300',
  'bg-orange-300', 'bg-blue-300',
];

// ====== APP STATE ======
let state = { tab: 'normal', systemMode: 'all', groupName: '', selected: [] };
let rootEl = document.getElementById('root');

// ====== RENDER ======
function render() {
  const { tab, systemMode, groupName, selected } = state;
  const isSystem = tab === 'system';
  const canCreate = isSystem
    ? (systemMode === 'all' ? groupName.trim().length > 0 : groupName.trim().length > 0 && selected.length > 0)
    : (groupName.trim().length > 0 && selected.length > 0);
  const showMemberPicker = !isSystem || (isSystem && systemMode === 'selected');
  const displayAvatars = selected.slice(0, 5);
  const extra = selected.length > 5 ? selected.length - 5 : 0;
  const btnText = !isSystem
    ? `创建群聊 (${selected.length}人)`
    : systemMode === 'all' ? '创建系统全员群' : `创建系统群聊 (${selected.length}人)`;

  rootEl.innerHTML = `
  <div class="flex flex-col h-full relative bg-[#faf8f5]">
    <!-- Header -->
    <div class="flex items-center gap-2 px-4 pt-3 pb-2 flex-shrink-0">
      <button class="p-2 rounded-xl hover:bg-black/5 transition-all active:scale-90" onclick="goBack()">
        ${I.ArrowLeft}
      </button>
      <span class="text-[17px] font-semibold text-cream-900 flex-1">创建群聊</span>
    </div>

    <!-- Tab Bar -->
    <div class="mx-4 mt-1 flex-shrink-0">
      <div class="flex rounded-xl p-1 relative" style="background: rgba(0,0,0,0.04)">
        <button id="tab-normal"
          class="tab-btn flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-lg text-[13px] font-medium transition-colors relative z-10"
          style="color: ${tab === 'normal' ? '#6b5e4a' : '#b0a090'}"
          onclick="switchTab('normal')">
          ${I.Users(tab === 'normal' ? '#6b5e4a' : '#b0a090')}
          普通群聊
        </button>
        <button id="tab-system"
          class="tab-btn flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-lg text-[13px] font-medium transition-colors relative z-10"
          style="color: ${tab === 'system' ? '#5b21b6' : '#b0a090'}"
          onclick="switchTab('system')">
          ${I.Shield(tab === 'system' ? '#7c3aed' : '#b0a090')}
          系统群聊
        </button>
        <!-- sliding bg -->
        <div class="absolute top-1 bottom-1 rounded-lg bg-white transition-all duration-300 z-0"
          style="left: ${tab === 'normal' ? '4px' : 'calc(50%)'}; width: calc(50% - 4px);
                 box-shadow: 0 2px 8px rgba(${tab === 'system' ? '139,92,246' : '0,0,0'}, ${tab === 'system' ? '0.12' : '0.06'});">
        </div>
      </div>
    </div>

    <!-- Scrollable Content -->
    <div class="flex-1 overflow-y-auto scrollbar-hide">
      <!-- System config area -->
      <div id="sys-config" class="overflow-hidden" style="transition: all 0.35s ease-out;">
        <div id="sys-config-inner">
          ${isSystem ? `
          <div class="mx-4 mt-3">
            <div class="flex items-center gap-1.5 mb-2.5">
              ${I.ShieldSmall('#7c3aed')}
              <span class="text-[11px] font-medium text-violet-600/70 tracking-wide">系统群聊成员不可自行退出</span>
            </div>
            <div class="grid grid-cols-2 gap-2.5">
              <button id="mode-all" onclick="setMode('all')" class="mode-card rounded-xl p-3 cursor-pointer transition-all relative overflow-hidden card-pulse"
                style="background: ${systemMode === 'all' ? 'rgba(139, 92, 246, 0.06)' : 'white'};
                       border: ${systemMode === 'all' ? '1.5px solid rgba(139, 92, 246, 0.4)' : '1.5px solid rgba(0,0,0,0.06)'};
                       box-shadow: ${systemMode === 'all' ? '0 4px 16px rgba(139,92,246,0.1)' : 'none'};">
                ${systemMode === 'all' ? '<div class="absolute top-2 right-2 w-5 h-5 rounded-full flex items-center justify-center check-pop" style="background: rgba(139,92,246,0.15)">'+I.Check('#7c3aed',11,3)+'</div>' : ''}
                ${I.Globe(systemMode === 'all' ? '#7c3aed' : '#c0b0a0')}
                <div class="mt-1.5 text-[13px] font-semibold" style="color: ${systemMode === 'all' ? '#5b21b6' : '#6b5e4a'}">全员群</div>
                <div class="mt-0.5 text-[10px] leading-relaxed" style="color: ${systemMode === 'all' ? 'rgba(139,92,246,0.6)' : '#c0b0a0'}">所有用户自动加入，不可退出</div>
              </button>
              <button id="mode-selected" onclick="setMode('selected')" class="mode-card rounded-xl p-3 cursor-pointer transition-all relative overflow-hidden card-pulse"
                style="background: ${systemMode === 'selected' ? 'rgba(99, 102, 241, 0.06)' : 'white'};
                       border: ${systemMode === 'selected' ? '1.5px solid rgba(99, 102, 241, 0.4)' : '1.5px solid rgba(0,0,0,0.06)'};
                       box-shadow: ${systemMode === 'selected' ? '0 4px 16px rgba(99,102,241,0.1)' : 'none'};">
                ${systemMode === 'selected' ? '<div class="absolute top-2 right-2 w-5 h-5 rounded-full flex items-center justify-center check-pop" style="background: rgba(99,102,241,0.15)">'+I.Check('#6366f1',11,3)+'</div>' : ''}
                ${I.UsersGroup(systemMode === 'selected' ? '#6366f1' : '#c0b0a0')}
                <div class="mt-1.5 text-[13px] font-semibold" style="color: ${systemMode === 'selected' ? '#4338ca' : '#6b5e4a'}">指定用户</div>
                <div class="mt-0.5 text-[10px] leading-relaxed" style="color: ${systemMode === 'selected' ? 'rgba(99,102,241,0.6)' : '#c0b0a0'}">仅指定用户加入，不可退出</div>
              </button>
            </div>
          </div>
          ` : ''}
        </div>
      </div>

      <!-- Preview Card -->
      <div class="mx-4 mt-4 rounded-2xl p-5 relative overflow-hidden"
        style="background: ${isSystem
          ? 'linear-gradient(135deg, #f8f5ff 0%, #ede4ff 30%, #e0d5f5 60%, #f5f0ff 100%)'
          : 'linear-gradient(135deg, #fef9f0 0%, #fdf3e0 30%, #fef0d5 60%, #fff8ed 100%)'};
               border: ${isSystem ? '1px solid rgba(139, 92, 246, 0.15)' : '1px solid rgba(212, 165, 116, 0.15)'};">
        <!-- dots -->
        <div class="absolute inset-0 opacity-[0.06]" style="background-image: radial-gradient(circle, currentColor 1px, transparent 1px); background-size: 16px 16px;"></div>
        <!-- system badge -->
        ${isSystem ? `
        <div class="absolute top-3 right-3 flex items-center gap-1 px-2 py-0.5 rounded-full" style="background: rgba(139, 92, 246, 0.12)">
          ${I.ShieldSmall('#7c3aed')}
          <span class="text-[10px] font-semibold text-violet-700">系统群</span>
        </div>` : ''}
        <div class="relative z-10 flex flex-col items-center gap-3">
          ${selected.length > 0 ? `
          <div class="flex items-center gap-1.5 flex-wrap justify-center">
            ${displayAvatars.map((id, i) => `
              <div class="rounded-full flex items-center justify-center font-semibold text-white flex-shrink-0 ${AVATAR_COLORS[id % AVATAR_COLORS.length]}" style="width: 36px; height: 36px; font-size: 15px;">
                ${FRIENDS.find(f => f.id === id)?.name?.[0] || '?'}
              </div>
            `).join('')}
            ${extra > 0 ? `<div class="rounded-full bg-white/70 flex items-center justify-center text-xs font-semibold text-cream-600 flex-shrink-0" style="width: 36px; height: 36px; border: 1.5px dashed #d4a574">+${extra}</div>` : ''}
          </div>` : `
          <div class="flex items-center gap-1.5">
            <div class="rounded-full w-9 h-9 shimmer"></div>
            <div class="rounded-full w-9 h-9 shimmer"></div>
            <div class="rounded-full w-9 h-9 shimmer"></div>
          </div>`}
          <div class="w-full max-w-[220px]">
            <input id="name-input" type="text" placeholder="输入群聊名称..." maxlength="20" value="${escapeHtml(groupName)}"
              class="w-full text-center text-[15px] font-semibold bg-transparent py-1.5 rounded-lg transition-all outline-none"
              style="color: ${isSystem ? '#5b21b6' : '#6b5e4a'}; caret-color: ${isSystem ? '#7c3aed' : '#d4a574'};">
            ${groupName ? `<div class="text-right text-[10px] mt-0.5" style="color: ${isSystem ? 'rgba(139,92,246,0.5)' : '#c0b0a0'}">${groupName.length}/20</div>` : ''}
          </div>
          <div class="text-[12px] font-medium" style="color: ${isSystem ? 'rgba(139,92,246,0.6)' : '#c0a888'}">
            ${selected.length > 0 ? `${selected.length} 位成员` : (isSystem && systemMode === 'all' ? '所有用户' : '选择成员加入群聊')}
          </div>
        </div>
      </div>

      <!-- Member Picker (only when needed) -->
      ${showMemberPicker ? `
      <div class="mt-4 px-4">
        <div class="flex items-center gap-2 mb-3">
          <div class="w-0.5 h-3.5 rounded-full" style="background: #d4a574"></div>
          <span class="text-[13px] font-semibold text-cream-700">选择成员</span>
        </div>
        <div class="flex gap-2.5 overflow-x-auto pb-2 scrollbar-hide" id="member-list">
          ${FRIENDS.map((u, i) => {
            const sel = selected.includes(u.id);
            return `
            <button onclick="toggleMember(${u.id})" class="member-btn flex flex-col items-center gap-1.5 flex-shrink-0 px-1 transition-all active:scale-[0.93]">
              <div class="relative">
                <div class="rounded-full flex items-center justify-center font-semibold text-white flex-shrink-0 transition-all ${AVATAR_COLORS[i % AVATAR_COLORS.length]} ${sel ? 'ring-2 ring-offset-1' : 'opacity-65'}"
                  style="width: 48px; height: 48px; font-size: 19px; ${sel ? '--tw-ring-color: #7c3aed;' : ''}">
                  ${u.name[0]}
                </div>
                ${sel ? `<div class="absolute -bottom-0.5 -right-0.5 w-5 h-5 rounded-full flex items-center justify-center check-pop" style="background: #7c3aed">${I.Check('white', 11, 3)}</div>` : ''}
              </div>
              <span class="text-[11px] font-medium max-w-[52px] truncate text-center transition-colors" style="color: ${sel ? '#5b21b6' : '#9b8b7a'}">${u.name}</span>
            </button>`;
          }).join('')}
        </div>
      </div>` : ''}

      <!-- Bottom spacer -->
      <div class="h-24"></div>
    </div>

    <!-- Bottom Button -->
    <div class="absolute bottom-0 left-0 right-0 px-4 pb-6 pt-3" style="background: linear-gradient(to top, #faf8f5 85%, transparent)">
      <button id="create-btn"
        class="w-full py-3.5 rounded-2xl flex items-center justify-center gap-2 text-[15px] font-semibold transition-all active:scale-[0.97]"
        style="background: ${canCreate
          ? (isSystem ? 'linear-gradient(135deg, #7c3aed, #6366f1)' : 'linear-gradient(135deg, #d4a574, #c49464)')
          : 'rgba(0,0,0,0.06)'};
               color: ${canCreate ? 'white' : '#c0b0a0'};
               box-shadow: ${canCreate
                 ? (isSystem ? '0 6px 24px rgba(124,58,237,0.3)' : '0 6px 24px rgba(212,165,116,0.3)')
                 : 'none'};
               cursor: ${canCreate ? 'pointer' : 'default'};"
        ${!canCreate ? 'disabled' : ''}>
        ${isSystem ? I.Shield17('white') : ''}
        ${btnText}
      </button>
    </div>
  </div>`;

  // Attach input listener
  const nameInput = document.getElementById('name-input');
  if (nameInput) {
    nameInput.addEventListener('input', (e) => {
      state.groupName = e.target.value;
      render();
    });
    // Re-focus after re-render
    setTimeout(() => nameInput.focus(), 0);
  }
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ====== ACTIONS ======
function switchTab(t) {
  state.tab = t;
  if (t === 'normal') { state.systemMode = 'all'; }
  render();
}

function setMode(m) {
  state.systemMode = m;
  render();
}

function toggleMember(id) {
  const idx = state.selected.indexOf(id);
  if (idx >= 0) state.selected.splice(idx, 1);
  else state.selected.push(id);
  render();
}

function goBack() {
  alert('返回上一页 (demo)');
}

// Initial render
render();
</script>
</body>
</html>
